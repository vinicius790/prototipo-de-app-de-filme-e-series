services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prototipo-filmes-series:latest
    container_name: prototipo-filmes-series
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
